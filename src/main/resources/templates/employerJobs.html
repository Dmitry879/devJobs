<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
	<head>
	    <meta charset="UTF-8">
	    <title>Employer Jobs</title>
	    <th:block th:replace="~{fragments/layout :: head}"></th:block>
	</head>
	
	<body class="text-white">
	
		<nav th:replace="~{fragments/layout :: navbar}"></nav>
		
		<div class="container mt-5">
		
			<h1 class="text-center">Employer Jobs</h1>
			
			<div sec:authorize="hasRole('EMPLOYER')">
				<a th:href="@{/employerJobs/create}" class="btn btn-secondary">Add New Job</a>
			</div>
			
			<hr>
			
			<div class="text-center" th:if="${#lists.isEmpty(employerJobs)}">
				<p>There are no jobs to display.</p>
			</div>
			
			<table class="table table-striped" th:if="${!#lists.isEmpty(employerJobs)}">
			
				<thead>
					<tr>
						<th scope="col">#</th>
						<th scope="col">Position</th>
						<th scope="col">Actions</th>
					</tr>
				</thead>
				
				<tbody>
					<tr th:each="posting, jobNum : ${employerJobs}">
						<td th:text="${jobNum.count}">1</td>
						<td th:text="${posting.position}">Position</td>
						<td>
							<a class="btn btn-secondary btn-sm"
							   th:href="@{/jobPostings/{id}(id=${posting.id})}">View</a>
							<a class="btn btn-warning btn-sm"
							   th:href="@{/employerJobs/edit/{id}(id=${posting.id})}">Edit</a>
							<a class="btn btn-danger btn-sm"
							   th:href="@{/employerJobs/delete/{id}(id=${posting.id})}"
							   onclick="return confirm ('Are you sure you want to delete this job announcement?')">Delete</a>
						</td>
					</tr>
				</tbody>
			
			</table>
		
		</div>
	
	</body>
