<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
	  
	<head>
	
	    <title>Employer Registration</title>
	    
	    <th:block th:replace="~{fragments/layout :: head}"></th:block>
	    
	    <style>
	    
		    h1 {
		    margin-bottom: 7rem;
		    }
	    
	    </style>
	    
	</head>
	
	<body class="text-white">
	
		<nav th:replace="~{fragments/layout :: navbar}"></nav>
		
		<div class="container mt-5">
			
			<h1 class="text-center">Create Employer Account</h1>
			
			<form th:action="@{/registerEmployer}" 
			      th:object="${employer}" 
			      method="post">
			      
			      <div class="row">
			      
				      	<div class="mb-3 col">
					    <label for="username" class="form-label">Username:</label>
					    <input type="text" class="form-control" id="username" th:field="*{username}">
				     </div>
		      		      
				  	<div class="mb-3 col">
					    <label for="password" class="form-label">Password:</label>
					    <input type="password" class="form-control" id="password" th:field="*{password}">
				  	</div>
				  	
				    <div class="mb-3 col">
					    <label for="confirmPassword" class="form-label">Confirm Password:</label>
					    <input type="password" class="form-control" id="confirmPassword" th:field="*{confirmPassword}">
					    <div th:if="${#fields.hasErrors('confirmPassword')}"
					    	 th:errors="*{confirmPassword}">
					    </div>		    
				    </div>
			      
			      </div>
			      
			     <div class="row">
			     
			     	<div class="mb-3 col">
					    <label for="name" class="form-label">Name:</label>
					    <input type="text" class="form-control" id="name" th:field="*{name}">			
					</div>
				
				    <div class="mb-3 col">
					    <label for="phone" class="form-label">Phone:</label>
					    <input type="text" class="form-control" id="phone" th:field="*{phone}">		    
				    </div>
				    
					<div class="mb-3 col">
					    <label for="email" class="form-label">Email:</label>
					    <input type="email" class="form-control" id="email" th:field="*{email}">			
					</div>
			     
			     </div>
					
			    <button type="submit" class="btn btn-secondary mt-3">Register</button>
			
			</form>
		
		</div>
	
	</body>
</html>
