<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

	<head>
	
		<th:block th:fragment="head">
	    	<meta charset="UTF-8">
	    	<title th:text="${pageTitle} ?: 'Dev Jobs'">Dev Jobs</title>
        	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        	<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
        	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
        	
        	<style>
        	
			    body {
			    	padding-top: 5rem;
			    	padding-bottom: 5rem;
			    	
			        background-image:
			        	linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)),
			        	url('/programming-background-image.avif');
			        background-size: cover;
			        background-position: center;
			        background-repeat: no-repeat;
			        min-height: 100vh;
				    }
				    
				h1 {
					margin-bottom: 3rem;
				}
				    
				.navbar-glass {
			        background: rgba(255, 255, 255, 0.15);
			        backdrop-filter: blur(10px);
			        -webkit-backdrop-filter: blur(10px);
			        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
			    }
			    
			    .navbar-nav .nav-link {
			        font-size: 1.25rem;
			    }
			    
			    .dropdown-menu-glass {
			    	background: rgba(255, 255, 255, 0.15);
			        backdrop-filter: blur(10px);
			        -webkit-backdrop-filter: blur(10px);
			        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
			    }
			    
			    .dropdown-menu-glass .dropdown-item:hover {
				    background-color: #212529;
				}
			    
			</style>
        	
	    </th:block>
		
	</head>

	<body>
		
		<nav th:fragment="navbar" class="navbar navbar-dark navbar-expand-lg navbar-glass fixed-top">
		  <div class="container-fluid">
		  
		    <a class="navbar-brand" href="#">DJ</a>
		    
		    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
		    		data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
		    		aria-expanded="false" aria-label="Toggle navigation">
		      <span class="navbar-toggler-icon"></span>
		      
		    </button>
		    
		    <div class="collapse navbar-collapse" id="navbarSupportedContent">
		    
		      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
		      
		        <li class="nav-item">
		          <a class="nav-link active" aria-current="page" th:href="@{/}">Home</a>
		        </li>
		        
		        <li class="nav-item" sec:authorize="isAuthenticated()">
		          <a class="nav-link text-white" th:href="@{/profile}">View Profile</a>
		        </li>
		        
		        <li class="nav-item">
		          <a class="nav-link text-white" th:href="@{/jobPostings}">Job Postings</a>
		        </li>
		        
		        <li class="nav-item" sec:authorize="hasRole('EMPLOYER')">
		          <a class="nav-link text-white" th:href="@{/employerJobs}">Manage Jobs</a>
		        </li>
		        
		        <li class="nav-item" sec:authorize="hasRole('EMPLOYER')">
		          <a class="nav-link text-white" th:href="@{/employerJobs}">Test Pipeline</a>
		        </li>
		        
		      </ul>
		      
		      
		      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
		      
		      	<li class="nav-item dropdown" sec:authorize="isAnonymous()">
		          <a class="nav-link dropdown-toggle text-white" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
		            Register
		          </a>
		          
		          <ul class="dropdown-menu dropdown-menu-end dropdown-menu-glass">
		          
		          	<li>
		          		<a class="dropdown-item text-white" th:href="@{/registerApplicant}">Register as Applicant</a>
		          	</li>
		          	
		          	<li>
		          		<a class="dropdown-item text-white" th:href="@{/registerEmployer}">Register as Employer</a>
		          	</li>
		          
		          </ul> 
		        </li>
		        
		        <li class="nav-item" sec:authorize="isAnonymous()">
		          <a class="nav-link text-white" th:href="@{/login}">Login</a>
		        </li>
		        
		        <li class="nav-item" sec:authorize="isAuthenticated()">
		        	<span class="nav-link text-white">
		        		Welcome, <span sec:authentication="name"></span>!
		        	</span>
		        </li>
		        
		        <li class="nav-item" sec:authorize="isAuthenticated()">
		        
		        	<form th:action="@{/logout}" method="post">
		        	
		        		<button type="submit"
		        				class="nav-link text-white">
		        			Logout
		        		</button>
		        	
		        	</form>
		        
		        </li>
		      
		      </ul>
		      
		    </div>
		  </div>
		</nav>
			
		<script th:fragment="scripts" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
		
	</body>

</html>
